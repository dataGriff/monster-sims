name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: lint, typecheck, test, smoke-play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Smoke-play seed 42 (must be a replayable win)
        run: |
          pnpm play --seed 42 > run1.log
          pnpm play --seed 42 > run2.log
          diff run1.log run2.log
          tail -n 2 run1.log
